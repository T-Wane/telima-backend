services:
  - type: web
    name: telima-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: telima-db
          property: externalConnectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: DISTANCE_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: mock
      - key: OTP_EXPOSE_IN_RESPONSE
        value: "true"
      - key: SWAGGER_ENABLED
        value: "true"

databases:
  - name: telima-db
    plan: free
    databaseName: telima
