# Telima sur le VPS partage (guide du 17/10/2026, responsable : Tidiane).
# Budget : 2 Go de RAM au total, 15 Go de disque. Aucun "ports:" : tout passe par Caddy.
# Lancer depuis /opt/vtc :  docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod ...
name: vtc

x-logging: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    logging: *logs
    mem_limit: 768m
    cpus: "1.5"
    env_file: ../.env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      # Compte de service Firebase (notifications push) : fichier hors Git, a placer dans /opt/vtc,
      # puis FCM_SERVICE_ACCOUNT_PATH=/app/fcm-service-account.json dans .env.prod.
      # - ../fcm-service-account.json:/app/fcm-service-account.json:ro
    networks:
      interne:
      edge:
        aliases: [vtc-api]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    # Meme version majeure que l'ancien serveur (15) pour restaurer la sauvegarde sans surprise.
    image: postgis/postgis:15-3.4-alpine
    restart: always
    logging: *logs
    mem_limit: 640m
    env_file: ../.env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    logging: *logs
    mem_limit: 192m
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [interne]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dashboard admin : fichiers statiques (npx vite build) copies dans /opt/vtc/dashboard-dist.
  web:
    image: nginx:1.27-alpine
    restart: always
    logging: *logs
    mem_limit: 64m
    volumes:
      - ../dashboard-dist:/usr/share/nginx/html:ro
      - ./nginx-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      edge:
        aliases: [vtc-web]

volumes:
  db_data:
  uploads_data:

networks:
  interne:
  edge:
    name: edge
    external: true
